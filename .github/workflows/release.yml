name: Release

# On push to main, a release follows only a feat or fix commit (the squash-merge title, e.g.
# `fix: … (1.4.1) (#12)`) whose version has no tag yet; ci/docs/test/chore/refactor merges publish nothing.
# Run it by hand (Actions -> Release -> Run workflow, or `gh workflow run release.yml`) to publish other
# bumps. The notes gather the CHANGELOG.md sections of every version since the previous tag, and the
# release only follows a commit on which Lint, Validate and HACS Validation pass.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  lint:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'feat') || startsWith(github.event.head_commit.message, 'fix') }}
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'feat') || startsWith(github.event.head_commit.message, 'fix') }}
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  hacs:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'feat') || startsWith(github.event.head_commit.message, 'fix') }}
    uses: ./.github/workflows/hacs.yml
    permissions:
      contents: read

  release:
    needs: [lint, validate, hacs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(jq -r .version custom_components/vacuum_map/manifest.json)"
          grep -q "VERSION = \"$VERSION\"" custom_components/vacuum_map/const.py
          grep -q "VACUUM_MAP_CARD_VERSION = '$VERSION'" src/vacuum-map-card/header.js
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PREVIOUS="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          echo "previous=${PREVIOUS#v}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::v$VERSION is already released: merge a version bump first"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.version.outputs.exists == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The card is assembled from its ES modules (src/vacuum-map-card/, scripts/build-frontend.mjs) into
      # frontend/vacuum-map-card.js, which the zip carries next to the vendored three.min.js.
      - name: Build the card
        if: steps.version.outputs.exists == 'false'
        run: |
          npm install --no-save --no-package-lock acorn@8.19.0
          node scripts/build-frontend.mjs
          test -s custom_components/vacuum_map/frontend/vacuum-map-card.js

      - name: Build zip and notes
        if: steps.version.outputs.exists == 'false'
        run: |
          (cd custom_components/vacuum_map && zip -r ../../vacuum_map.zip . -x "__pycache__/*")
          .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.previous }}" > notes.md
          test -s notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: vacuum_map.zip
          body_path: notes.md
          make_latest: true
